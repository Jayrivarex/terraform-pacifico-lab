apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacifico-api-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacifico-api
  template:
    metadata:
      labels:
        app: pacifico-api
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: pacifico-api
        image: acrpacificodevopsxyz.azurecr.io/pacifico-api:v1
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pacifico-api-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: pacifico-api